{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Entrar</h1>
  {% if error %}<p class="alert error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>E-mail<input type="email" name="email" value="{{ email or '' }}" required autofocus autocomplete="username"></label>
    <label>Senha<input type="password" name="password" required autocomplete="current-password"></label>
    <button type="submit">Entrar</button>
  </form>
  <hr>
  <h2 class="small">Sem senha</h2>
  <p class="muted small">Receba um código de acesso no seu e-mail.</p>
  <form method="post" action="/login/code/send">
    <input type="hidden" name="next" value="{{ next }}">
    <label>E-mail<input type="email" name="email" value="{{ email or '' }}" required autocomplete="username"></label>
    <button type="submit">Enviar código</button>
  </form>
  <p class="small"><a href="/password">Primeiro acesso ou esqueceu a senha? Defina sua senha</a></p>
</section>
{% endblock %}
