{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Entrar</h1>
  <p class="muted">Informe a chave de acesso (<code>APP_API_KEY</code>).</p>
  {% if error %}<p class="alert error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Chave<input type="password" name="api_key" required autofocus autocomplete="current-password"></label>
    <button type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
