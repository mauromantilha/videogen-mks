{% extends "base.html" %}
{% block title %}Código de acesso{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Código de acesso</h1>
  {% if notice %}<p class="alert">{{ notice }}</p>{% endif %}
  {% if error %}<p class="alert error">{{ error }}</p>{% endif %}
  <form method="post" action="/login/code">
    <input type="hidden" name="next" value="{{ next }}">
    <input type="hidden" name="email" value="{{ email }}">
    <p class="muted small">Enviado para <strong>{{ email }}</strong>.</p>
    <label>Código<input name="code" required autofocus inputmode="numeric" autocomplete="one-time-code" maxlength="16"></label>
    <button type="submit">Entrar</button>
  </form>
  <p class="small"><a href="/login">Voltar</a></p>
</section>
{% endblock %}
