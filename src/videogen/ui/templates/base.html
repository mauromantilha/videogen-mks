<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false}'>
  <title>{% block title %}VideoGen{% endblock %} · VideoGen MKS</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/vendor/htmx-ext-sse.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">VideoGen <span>MKS</span></a>
    {% block nav %}
    <nav>
      <a href="/">Vídeos</a>
      <a href="/voices">Vozes</a>
      <form method="post" action="/logout"><button class="link" type="submit">Sair</button></form>
    </nav>
    {% endblock %}
  </header>
  <div id="flash" role="status" aria-live="polite"></div>
  <main class="container">{% block content %}{% endblock %}</main>
</body>
</html>
