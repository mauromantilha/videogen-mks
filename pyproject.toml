[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "videogen-mks"
version = "0.1.0"
description = "Gerador de vídeos curtos a partir de linguagem natural (roteiro aprovado → render serverless)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "mauro mantilha" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]
extend-exclude = ["docs", "workspace", "src/videogen/ui/static"]  # docs: pseudo-código ilustrativo

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C90", "PLR", "ASYNC", "S", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 50
max-branches = 12
max-returns = 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S603", "S607"]
"scripts/check_limits.py" = ["S603", "S607"]  # git diff com argumentos fixos, sem shell

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "ffmpeg: exige ffmpeg/ffprobe com libass instalados",
    "e2e: fluxo completo de dois estágios",
    "live: chama provedores reais e gera custo (RUN_LIVE=1)",
]

[tool.coverage.run]
source = ["videogen"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
